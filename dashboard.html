<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lexis - Dashboard</title>
    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      :root {
        --duo-green: #58cc02;
        --duo-green-shadow: #58a700;
        --duo-blue: #1cb0f6;
        --duo-blue-shadow: #1899d6;
        --duo-red: #ff4b4b;
        --duo-red-shadow: #cc3b3b;
        --duo-gold: #ffc800;
        --duo-gold-shadow: #d9a000;
        --duo-text: #4b4b4b;
        --duo-muted: #777;
        --duo-border: #e5e5e5;
        --duo-offwhite: #f7f7f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Comic Sans MS", "Arial", sans-serif;
        color: var(--duo-text);
        background-color: var(--duo-offwhite);
      }

      /* ── Navbar ────────────────────────────────────────────── */
      .lexis-navbar {
        background: #fff;
        border-bottom: 2px solid var(--duo-border);
      }

      .lexis-navbar .navbar-brand {
        font-size: 1.6rem;
        font-weight: 900;
        color: var(--duo-green);
        letter-spacing: 1px;
      }

      .status-pill {
        background: var(--duo-offwhite);
        border: 2px solid var(--duo-border);
        border-radius: 50px;
        padding: 6px 14px;
        font-weight: 800;
        font-size: 0.9rem;
        white-space: nowrap;
      }

      /* ── Sidebar cards ─────────────────────────────────────── */
      .sidebar-card {
        background: #fff;
        border: 2px solid var(--duo-border);
        border-radius: 20px;
        padding: 20px;
      }

      /* ── Duolingo-style sidebar buttons ───────────────────── */
      .btn-duo-sidebar {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: none;
        border-bottom: 4px solid transparent;
        border-radius: 14px;
        font-weight: 800;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        padding: 14px 18px;
        cursor: pointer;
        transition: filter 0.15s, transform 0.1s, border-bottom-width 0.1s;
      }

      .btn-duo-sidebar:active {
        border-bottom-width: 2px;
        transform: translateY(2px);
      }

      .btn-hardcore {
        background-color: var(--duo-red);
        color: #fff;
        border-bottom-color: var(--duo-red-shadow);
      }

      .btn-hardcore:hover {
        filter: brightness(1.08);
        color: #fff;
      }

      .btn-pdf {
        background-color: var(--duo-blue);
        color: #fff;
        border-bottom-color: var(--duo-blue-shadow);
      }

      .btn-pdf:hover {
        filter: brightness(1.08);
        color: #fff;
      }

      .btn-store {
        background-color: var(--duo-gold);
        color: var(--duo-text);
        border-bottom-color: var(--duo-gold-shadow);
      }

      .btn-store:hover {
        filter: brightness(1.05);
        color: var(--duo-text);
      }

      /* ── Roadmap ───────────────────────────────────────────── */
      .roadmap-path {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 8px 0;
      }

      .roadmap-node {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.7rem;
        cursor: pointer;
        position: relative;
        transition: transform 0.15s;
      }

      .roadmap-node:hover {
        transform: scale(1.08);
      }

      .roadmap-node.node-done {
        background-color: var(--duo-green);
        box-shadow: 0 6px 0 var(--duo-green-shadow);
        color: #fff;
      }

      .roadmap-node.node-active {
        background-color: var(--duo-green);
        box-shadow: 0 6px 0 var(--duo-green-shadow);
        color: #fff;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 6px 0 var(--duo-green-shadow);
        }
        50% {
          box-shadow: 0 6px 0 var(--duo-green-shadow),
            0 0 0 8px rgba(88, 204, 2, 0.2);
        }
      }

      .roadmap-node.node-locked {
        background-color: #e5e5e5;
        box-shadow: 0 6px 0 #ccc;
        color: #aaa;
        cursor: not-allowed;
      }

      .roadmap-node.node-chest {
        background-color: var(--duo-gold);
        box-shadow: 0 6px 0 var(--duo-gold-shadow);
        color: var(--duo-text);
      }

      .roadmap-node .node-label {
        position: absolute;
        top: -26px;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        border: 2px solid var(--duo-border);
        border-radius: 8px;
        padding: 2px 8px;
        font-size: 0.65rem;
        font-weight: 800;
        white-space: nowrap;
        color: var(--duo-text);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        pointer-events: none;
      }

      .roadmap-connection {
        width: 6px;
        height: 44px;
        border-radius: 3px;
        background-color: #e5e5e5;
      }

      .roadmap-connection.conn-done {
        background-color: var(--duo-green);
      }

      /* ── User profile ──────────────────────────────────────── */
      .user-avatar {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 4px solid var(--duo-green);
        background: var(--duo-offwhite);
        object-fit: cover;
      }

      .xp-bar-bg {
        height: 10px;
        background: var(--duo-border);
        border-radius: 10px;
        overflow: hidden;
      }

      .xp-bar-fill {
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--duo-green),
          var(--duo-blue)
        );
        border-radius: 10px;
        transition: width 0.6s ease;
      }

      .stat-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 2px solid var(--duo-border);
        font-weight: 800;
        color: var(--duo-text);
      }

      .stat-row:last-child {
        border-bottom: none;
      }

      .stat-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 0.95rem;
        flex-shrink: 0;
      }

      /* ── Dashboard layout ──────────────────────────────────── */
      .dashboard-layout {
        padding-top: 86px;
        padding-bottom: 40px;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- ── Navbar ─────────────────────────────────────────────── -->
    <nav
      class="navbar navbar-expand-lg lexis-navbar shadow-sm py-3 fixed-top"
    >
      <div class="container-xl px-4">
        <a class="navbar-brand" href="index.html">
          <i class="fa-solid fa-puzzle-piece text-warning me-1"></i> Lexis
        </a>

        <div class="d-flex align-items-center gap-2 ms-auto">
          <div class="status-pill text-warning">
            <i class="fa-solid fa-coins me-1"></i>
            <span id="coin-count">300</span>
          </div>
          <div class="status-pill text-info">
            <i class="fa-solid fa-star me-1"></i>
            <span id="xp-count">1,250</span> XP
          </div>
          <img
            src="https://api.dicebear.com/7.x/avataaars/svg?seed=mrjshzk"
            alt="Avatar"
            class="rounded-circle border border-2 border-success bg-white"
            width="46"
            height="46"
            style="cursor: pointer"
          />
        </div>
      </div>
    </nav>

    <!-- ── Dashboard layout ──────────────────────────────────── -->
    <div class="dashboard-layout">
      <div class="container-xl px-4">
        <div class="row g-4 align-items-start">
          <!-- ── LEFT: Action buttons ─────────────────────────── -->
          <div class="col-lg-3">
            <div class="sidebar-card d-flex flex-column gap-3">
              <button class="btn-duo-sidebar btn-hardcore">
                <i class="fa-solid fa-fire fa-fw"></i>
                Hardcore Mode
              </button>
              <button class="btn-duo-sidebar btn-pdf">
                <i class="fa-solid fa-file-pdf fa-fw"></i>
                Read PDFs
              </button>
              <button class="btn-duo-sidebar btn-store">
                <i class="fa-solid fa-store fa-fw"></i>
                Store
              </button>
            </div>
          </div>

          <!-- ── MIDDLE: Exercise roadmap ─────────────────────── -->
          <div class="col-lg-6">
            <div class="sidebar-card">
              <h5
                class="fw-bold text-center mb-4"
                style="color: var(--duo-text)"
              >
                <i
                  class="fa-solid fa-route text-success me-2"
                ></i>
                Learning Path
              </h5>

              <div class="roadmap-path">
                <!-- Node 1 – completed -->
                <div
                  class="roadmap-node node-done"
                  title="Unit 1: Basics"
                  aria-label="Unit 1: Basics – Completed"
                >
                  <span class="node-label">Unit 1</span>
                  <i class="fa-solid fa-star"></i>
                </div>
                <div class="roadmap-connection conn-done"></div>

                <!-- Node 2 – completed -->
                <div
                  class="roadmap-node node-done"
                  title="Unit 2: Greetings"
                  aria-label="Unit 2: Greetings – Completed"
                >
                  <span class="node-label">Unit 2</span>
                  <i class="fa-solid fa-comments"></i>
                </div>
                <div class="roadmap-connection conn-done"></div>

                <!-- Node 3 – active (current) -->
                <div
                  class="roadmap-node node-active"
                  title="Unit 3: Phrases – In Progress"
                  aria-label="Unit 3: Phrases – In Progress"
                >
                  <span class="node-label">Unit 3</span>
                  <i class="fa-solid fa-book-open"></i>
                </div>
                <div class="roadmap-connection"></div>

                <!-- Node 4 – locked -->
                <div
                  class="roadmap-node node-locked"
                  title="Unit 4: Numbers – Locked"
                  aria-label="Unit 4: Numbers – Locked"
                >
                  <span class="node-label">Unit 4</span>
                  <i class="fa-solid fa-lock"></i>
                </div>
                <div class="roadmap-connection"></div>

                <!-- Node 5 – locked -->
                <div
                  class="roadmap-node node-locked"
                  title="Unit 5: Advanced – Locked"
                  aria-label="Unit 5: Advanced – Locked"
                >
                  <span class="node-label">Unit 5</span>
                  <i class="fa-solid fa-lock"></i>
                </div>
                <div class="roadmap-connection"></div>

                <!-- Chest reward -->
                <div
                  class="roadmap-node node-chest"
                  title="Reward Chest – Locked"
                  aria-label="Reward Chest – Locked"
                >
                  <i class="fa-solid fa-gift"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- ── RIGHT: User profile ───────────────────────────── -->
          <div class="col-lg-3">
            <div class="sidebar-card text-center">
              <!-- DiceBear avatar via API URL -->
              <img
                src="https://api.dicebear.com/7.x/avataaars/svg?seed=mrjshzk"
                alt="User Avatar"
                class="user-avatar mb-3"
              />
              <h4 class="fw-bold mb-0" style="color: var(--duo-text)">
                mrjshzk
              </h4>
              <p class="text-muted small mb-3">Language Learner</p>

              <!-- XP progress bar -->
              <div class="mb-3 text-start">
                <div
                  class="d-flex justify-content-between small fw-bold mb-1"
                  style="color: var(--duo-muted)"
                >
                  <span>Level 5</span>
                  <span>1,250 / 2,000 XP</span>
                </div>
                <div class="xp-bar-bg">
                  <div class="xp-bar-fill" style="width: 62.5%"></div>
                </div>
              </div>

              <!-- Stats -->
              <div class="text-start">
                <div class="stat-row">
                  <div
                    class="stat-icon bg-warning bg-opacity-25 text-warning"
                  >
                    <i class="fa-solid fa-trophy"></i>
                  </div>
                  <span>Level <strong>5</strong></span>
                </div>
                <div class="stat-row">
                  <div
                    class="stat-icon bg-info bg-opacity-25 text-info"
                  >
                    <i class="fa-solid fa-bolt"></i>
                  </div>
                  <span><strong>1,250</strong> XP</span>
                </div>
                <div class="stat-row">
                  <div
                    class="stat-icon bg-warning bg-opacity-25 text-warning"
                  >
                    <i class="fa-solid fa-coins"></i>
                  </div>
                  <span><strong>300</strong> Coins</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
